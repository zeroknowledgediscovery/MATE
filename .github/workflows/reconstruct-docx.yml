name: Reconstruct COSMOS MATE DOCX

on:
  push:
    paths:
      - '_docx_parts/**'

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and validate DOCX
        shell: bash
        run: |
          set -euo pipefail
          test -f _docx_parts/part06.b64
          cat _docx_parts/part*.b64 | base64 --decode > COSMOS_MATE_Definition_Worksheet.docx
          python - <<'PY'
          import os, zipfile
          p = 'COSMOS_MATE_Definition_Worksheet.docx'
          assert os.path.getsize(p) > 1000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print(os.path.getsize(p))
          PY
      - name: Commit reconstructed DOCX and remove staging parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r _docx_parts
          git add COSMOS_MATE_Definition_Worksheet.docx
          git commit -m 'Add COSMOS MATE definition worksheet DOCX'
          git push
